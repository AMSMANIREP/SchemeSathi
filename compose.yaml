services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: sathi
      POSTGRES_USER: sathi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - sathi_pg:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U sathi"]
      interval: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: [python, migrate.py]
    environment:
      DATABASE_URL: postgresql://sathi:${POSTGRES_PASSWORD}@postgres:5432/sathi
    depends_on:
      postgres:
        condition: service_healthy
  rules:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: postgresql://sathi:${POSTGRES_PASSWORD}@postgres:5432/sathi
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY}
      STORAGE_MODE: postgres
    depends_on:
      migrate:
        condition: service_completed_successfully
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:3000:3000"]
    environment:
      DATA_STORAGE_MODE: dual
      POSTGRES_SERVICE_URL: http://rules:8000
      POSTGRES_SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY}
      STORAGE_SYNC_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY}
      RULE_SERVICE_URL: http://rules:8000
      RULE_SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY}
      SERVICE_API_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY}
    volumes:
      - sathi_web_wrangler:/app/.wrangler
    depends_on:
      rules:
        condition: service_started
  storage-sync:
    image: schemesathi-web
    command: [node, scripts/storage-sync-loop.mjs]
    restart: unless-stopped
    environment:
      STORAGE_SYNC_URL: http://web:3000
      STORAGE_SYNC_KEY: ${SERVICE_API_KEY:?Set SERVICE_API_KEY}
    depends_on:
      web:
        condition: service_started
  adminer:
    image: adminer:5
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  sathi_pg:
  sathi_web_wrangler:
